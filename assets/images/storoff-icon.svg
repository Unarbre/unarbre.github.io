<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Storoff app icon: a sleepy, smiling open book under a night sky. Source for icon.png/.icns/.ico. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A73" />
      <stop offset="1" stop-color="#6A4F9C" />
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFAF0" />
      <stop offset="1" stop-color="#F6E7CC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28" />
    </filter>
    <mask id="crescent">
      <circle cx="700" cy="262" r="74" fill="#fff" />
      <circle cx="734" cy="234" r="66" fill="#000" />
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)" filter="url(#shadow)" />

  <!-- Moon and stars -->
  <circle cx="700" cy="262" r="74" fill="#FFE29A" mask="url(#crescent)" />
  <g fill="#FFE29A">
    <path d="M300 262 Q300 300 338 300 Q300 300 300 338 Q300 300 262 300 Q300 300 300 262 Z" />
    <path d="M396 404 Q396 426 418 426 Q396 426 396 448 Q396 426 374 426 Q396 426 396 404 Z" opacity="0.85" />
    <path d="M806 410 Q806 436 832 436 Q806 436 806 462 Q806 436 780 436 Q806 436 806 410 Z" />
    <path d="M232 456 Q232 470 246 470 Q232 470 232 484 Q232 470 218 470 Q232 470 232 456 Z" opacity="0.7" />
    <path d="M540 186 Q540 204 558 204 Q540 204 540 222 Q540 204 522 204 Q540 204 540 186 Z" opacity="0.8" />
  </g>

  <!-- Trail of story sparkles rising from the book -->
  <path
    d="M512 540 C 470 476, 586 448, 556 384 C 530 330, 574 300, 618 300"
    fill="none"
    stroke="#FFE29A"
    stroke-width="13"
    stroke-linecap="round"
    stroke-dasharray="0.1 30"
  />

  <!-- Book -->
  <path
    d="M512 590 C 440 556 320 552 236 580 L 236 796 C 320 772 440 772 512 806 C 584 772 704 772 788 796 L 788 580 C 704 552 584 556 512 590 Z"
    fill="#F2837B"
  />
  <path
    d="M512 562 C 450 522 330 517 258 547 L 258 764 C 330 735 450 740 512 778 Z"
    fill="url(#page)"
  />
  <path
    d="M512 562 C 574 522 694 517 766 547 L 766 764 C 694 735 574 740 512 778 Z"
    fill="url(#page)"
  />
  <path d="M512 566 L 512 774" stroke="#E6D3B0" stroke-width="6" stroke-linecap="round" />

  <!-- Face -->
  <g fill="none" stroke="#3B2F4A" stroke-width="15" stroke-linecap="round">
    <path d="M366 640 Q 398 670 430 640" />
    <path d="M594 640 Q 626 670 658 640" />
    <path d="M486 690 Q 512 716 538 690" />
  </g>
  <ellipse cx="370" cy="694" rx="28" ry="16" fill="#F7A1B5" opacity="0.85" />
  <ellipse cx="654" cy="694" rx="28" ry="16" fill="#F7A1B5" opacity="0.85" />
</svg>
