<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Carton's app icon: its mark (assets/brand/mark.svg in the app's repo) on the navy of the app. -->
  <defs>
    <radialGradient id="navy" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#1C2742"/>
      <stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#navy)"/>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2C4D"/>
      <stop offset="1" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D58C"/>
