    <path d="M444 370 L580 470 L444 570 L580 670" fill="none" stroke="#E3B55B" stroke-opacity="0.55" stroke-width="12" stroke-dasharray="4 26" stroke-linecap="round"/>
    <circle cx="580" cy="670" r="48" fill="#17213A" stroke="#3B4C77" stroke-width="12"/>
    <circle cx="444" cy="570" r="48" fill="#19243F" stroke="#3B4C77" stroke-width="12"/>
    <circle cx="580" cy="470" r="48" fill="#C99A45"/>
    <circle cx="444" cy="370" r="110" fill="url(#glow)"/>
    <circle cx="444" cy="370" r="56" fill="url(#gold)"/>
